name: Ravensight Doctor
description: Static integration linter for Ravensight game analytics SDKs. Scans your project and fails the build on integration errors.
branding:
  icon: activity
  color: orange
inputs:
  path:
    description: Directory to scan, relative to the workspace
    required: false
    default: .
  report:
    description: Set to "true" to also submit the report to the Ravensight API
    required: false
    default: "false"
  api-key:
    description: Ravensight ingest key (gt_live_...) used when report or live is "true". Store it as a repository secret.
    required: false
    default: ""
  strict:
    description: Set to "true" to fail the step on any status but pass (warn and inconclusive included) and on any trace finding
    required: false
    default: "false"
  live:
    description: Set to "true" to send one test event with the ingest key and confirm the API stored it
    required: false
    default: "false"
  track-fn:
    description: Your own track functions, comma separated (for example capture,Analytics.logEvent)
    required: false
    default: ""
  include-tests:
    description: Set to "true" to also look for track calls in test paths
    required: false
    default: "false"
  include-docs:
    description: Set to "true" to also look for track calls in docs, Markdown, text and HTML files
    required: false
    default: "false"
  contract:
    description: Event contract file, relative to the workspace (default ravensight.contract.json in path, when it exists)
    required: false
    default: ""
  trace:
    description: JSONL file of events to replay against the contract, relative to the workspace (at most 50,000 lines)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run ravensight doctor
      shell: bash
      env:
        DOCTOR_PATH: ${{ inputs.path }}
        DOCTOR_REPORT: ${{ inputs.report }}
        DOCTOR_STRICT: ${{ inputs.strict }}
        DOCTOR_LIVE: ${{ inputs.live }}
        DOCTOR_TRACK_FN: ${{ inputs.track-fn }}
        DOCTOR_INCLUDE_TESTS: ${{ inputs.include-tests }}
        DOCTOR_INCLUDE_DOCS: ${{ inputs.include-docs }}
        DOCTOR_CONTRACT: ${{ inputs.contract }}
        DOCTOR_TRACE: ${{ inputs.trace }}
        RAVENSIGHT_INGEST_KEY: ${{ inputs.api-key }}
      run: |
        args=("$DOCTOR_PATH")
        if [ "$DOCTOR_REPORT" = "true" ]; then
          args+=("--report")
        fi
        if [ "$DOCTOR_STRICT" = "true" ]; then
          args+=("--strict")
        fi
        if [ "$DOCTOR_LIVE" = "true" ]; then
          args+=("--live")
        fi
        if [ -n "$DOCTOR_TRACK_FN" ]; then
          args+=("--track-fn" "$DOCTOR_TRACK_FN")
        fi
        if [ "$DOCTOR_INCLUDE_TESTS" = "true" ]; then
          args+=("--include-tests")
        fi
        if [ "$DOCTOR_INCLUDE_DOCS" = "true" ]; then
          args+=("--include-docs")
        fi
        if [ -n "$DOCTOR_CONTRACT" ]; then
          args+=("--contract" "$DOCTOR_CONTRACT")
        fi
        if [ -n "$DOCTOR_TRACE" ]; then
          args+=("--trace" "$DOCTOR_TRACE")
        fi
        node "$GITHUB_ACTION_PATH/bin/ravensight-doctor.js" "${args[@]}"
