name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'Reality-Software-Entertainment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - name: Tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) { console.error('tag does not match package.json version'); process.exit(1); }"
      - run: npm publish --provenance --access public
