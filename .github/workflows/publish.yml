name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Skipped until the owner sets repository variable NPM_TRUSTED_PUBLISHING to true, after npmjs.com, package ravensight-doctor, Settings, Trusted publishing, adds GitHub Actions for Reality-Software-Entertainment/ravensight-doctor with workflow file publish.yml.
    if: github.repository_owner == 'Reality-Software-Entertainment' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - name: Tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) { console.error('tag does not match package.json version'); process.exit(1); }"
      - name: Skip when this version is already on npm
        id: published
        run: |
          n=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm publish --provenance --access public
        if: steps.published.outputs.skip != 'true'
